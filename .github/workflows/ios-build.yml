name: Swift Code Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_15.4.app/Contents/Developer" || sudo xcode-select -s "/Applications/Xcode_15.3.app/Contents/Developer" || sudo xcode-select -s "/Applications/Xcode_15.2.app/Contents/Developer" || true

      - name: Validate Swift syntax
        run: |
          echo "Validating Swift source files..."
          find Sources -name "*.swift" -exec swiftc -parse {} \;
          echo "✅ All Swift files have valid syntax"

      - name: Check project structure
        run: |
          echo "Checking project structure..."
          ls -la Sources/
          ls -la Resources/
          echo "✅ Project structure looks good"
