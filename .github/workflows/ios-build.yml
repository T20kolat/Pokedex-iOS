name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_15.4.app/Contents/Developer" || sudo xcode-select -s "/Applications/Xcode_15.3.app/Contents/Developer" || sudo xcode-select -s "/Applications/Xcode_15.2.app/Contents/Developer" || true

      - name: Install dependencies
        run: |
          brew update
          brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: |
          xcodegen generate
          # Ensure project format compatibility
          xcodebuild -project Pokedex.xcodeproj -list

      - name: Build (Debug, iPhone 15 Pro)
        run: |
          xcodebuild -project Pokedex.xcodeproj -scheme Pokedex -destination 'platform=iOS Simulator,name=iPhone 15 Pro' -configuration Debug build | xcbeautify
        shell: bash

      - name: Archive (skip signing)
        run: |
          xcodebuild -project Pokedex.xcodeproj -scheme Pokedex -destination 'generic/platform=iOS' -configuration Release -archivePath build/Pokedex.xcarchive clean archive CODE_SIGNING_ALLOWED=NO | xcbeautify
        shell: bash
